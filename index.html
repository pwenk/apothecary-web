    <script>
      // Apply the saved style and layout before first paint so the page never flashes the wrong look.
      (function () {
        var q = new URLSearchParams(location.search);
        var v = q.get("v");
        var l = q.get("l");
        try {
          v = v || localStorage.getItem("apothecary-style");
          l = l || localStorage.getItem("apothecary-layout");
        } catch (e) {}
        if (v === "1" || v === "2" || v === "3") document.documentElement.dataset.style = v;
        if (/^(10|[0-9])$/.test(l || "")) document.documentElement.dataset.layout = l;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
